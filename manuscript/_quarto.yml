project:
  type: website
  render:
    - manuscript.qmd
    - supplementary.qmd

website:
  navbar:
    left:
      - href: manuscript.qmd
        text: Manuscript
      - href: supplementary.qmd
        text: Supplementary
      - href: https://matcasti.github.io/SPARK-app/
        text: Web-App
    right:
      - icon: github
        href: https://github.com/matcasti/SPARK-model/

format:
  html:
    title-block-style: manuscript
    embed-resources: true
    resources: [model_code.R]
    code-links:
      - text: Model (R script)
        href: model_code.R
        icon: file-code
    theme:
      light: Yeti
      dark: Cyborg
    toc: true
  typst:
    keep-typ: true
    papersize: a4
    margin:
      x: 2.2cm
      y: 2.4cm
    fontsize: 10.5pt
    section-numbering: 1.1.1
    toc: false
    template-partials:
      - templates/typst-template.typ
      - templates/typst-show.typ

bibliography: support/citations.bib
number-sections: true
date: today
